{{ define "title" }}Choose a new password - Webhook Tester{{ end }}
{{ define "body" }}
<main class="app-shell flex min-h-screen items-center justify-center p-5"><div class="w-full max-w-md"><a href="/" class="mb-10 flex items-center gap-3"><span class="brand-mark">+</span><span class="font-semibold">Webhook Tester</span></a><div class="surface p-6 sm:p-8"><p class="eyebrow">Account recovery</p><h1 class="mt-3 text-2xl font-semibold">Choose a new password</h1><p class="mt-2 text-sm leading-6 text-slate-500">Use a strong password you do not use elsewhere.</p>{{ if .Error }}<div class="mt-6 rounded-xl border border-red-500/20 bg-red-500/10 p-3 text-sm text-red-300">{{ .Error }}</div>{{ end }}<form method="POST" action="/reset-password" class="mt-7 space-y-5">{{ .CSRFField }}<input type="hidden" name="token" value="{{ .Token }}"/><div><label for="password" class="field-label">New password</label><input id="password" type="password" name="password" required class="field" value="{{ .Password }}" /></div><div><label for="confirm_password" class="field-label">Confirm new password</label><input id="confirm_password" type="password" name="confirm_password" required class="field" value="{{ .ConfirmPassword }}" /></div><button type="submit" class="btn-primary w-full">Update password</button></form></div></div></main>
{{ end }}
